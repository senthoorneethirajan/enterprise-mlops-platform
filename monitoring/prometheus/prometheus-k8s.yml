# Prometheus config for the IN-CLUSTER deployment (Task 5).
# Discovers churn-serving pods via the prometheus.io/* annotations set in k8s/*.yaml.
# (prometheus.yml in this directory is the host-local dev variant.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Batch/job metrics (drift detector pushes drift_psi here — Task 6).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway.monitoring.svc:9091"]

  - job_name: churn-serving
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [default]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_track]
        action: replace
        target_label: track
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
