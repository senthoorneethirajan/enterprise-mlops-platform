# Stable track of the churn-serving deployment (Task 3).
# The Service in service.yaml selects app=churn-serving across BOTH tracks, so traffic
# splits by replica count between stable (here) and canary (canary.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-serving-stable
  labels:
    app: churn-serving
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: churn-serving
      track: stable
  template:
    metadata:
      labels:
        app: churn-serving
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: churn-serving:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
