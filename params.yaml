# Central pipeline parameters — tracked by DVC so any change re-triggers the right stages.
data:
  n_samples: 20000
  seed: 42

preprocess:
  test_size: 0.2
  seed: 42

train:
  # v2 iteration: more trees, slightly deeper — canary-tested against v1 (Task 4)
  n_estimators: 400
  max_depth: 14
  min_samples_leaf: 2
  seed: 42

evaluate:
  # Quality gate: evaluation fails (non-zero exit) below these thresholds.
  # This is what blocks bad models in CI (Task 2) and canary promotion (Task 4).
  min_roc_auc: 0.80
  min_f1: 0.60
